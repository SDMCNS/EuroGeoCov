[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eurogeocov"
version = "0.1.0"
description = "European Geodatabase, DEMTIFF, Line-of-Sight (LoS) RF Propagation, and 1000-ft Airspace Coverage Library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary / In-House Prototype" }
authors = [
    { name = "EuroGeoCov Team" }
]
dependencies = [
    "rasterio>=1.3.0",
    "pyproj>=3.5.0",
    "duckdb>=0.9.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[project.scripts]
eurogeocov-server = "scripts.run_server:main"
eurogeocov-build-db = "scripts.build_geodatabase.py:main"

[tool.setuptools.packages.find]
include = ["eurogeocov*"]
